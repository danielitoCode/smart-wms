name: WMS twin validation

on:
  push:
    branches:
      - feat/wms-prismatec-genesis
    paths:
      - 'wms-twin/**'
      - 'api/prismatec/**'
      - 'tests/wms-twin/**'
      - '.github/workflows/wms-twin-ci.yml'
      - 'Guia.md'
      - 'EstructuraBackendGo.md'
      - 'NivelDeParidadConBackendOriginal.md'
      - 'AUDITORIA_GEMELO.md'
  pull_request:
    branches:
      - feat/wms-prismatec-genesis
    paths:
      - 'wms-twin/**'
      - 'api/prismatec/**'
      - 'tests/wms-twin/**'
      - '.github/workflows/wms-twin-ci.yml'
      - 'Guia.md'
      - 'EstructuraBackendGo.md'
      - 'NivelDeParidadConBackendOriginal.md'
      - 'AUDITORIA_GEMELO.md'

permissions:
  contents: read

concurrency:
  group: wms-twin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the project handover documents
        run: |
          set -eu
          for file in Guia.md EstructuraBackendGo.md NivelDeParidadConBackendOriginal.md AUDITORIA_GEMELO.md; do
            test -s "$file" || { echo "Missing or empty required document: $file"; exit 1; }
          done
      - name: Reject changes to the original backend and frontend
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -E '^(api/(?!prismatec/)|admin/|mobile/|db/)' || true)"
          if [ -n "$forbidden" ]; then
            echo "Changes detected in protected original application paths:"
            echo "$forbidden"
            echo "The twin work must not modify the original backend, frontend or database files."
            exit 1
          fi
      - name: Check audit trail references
        run: |
          set -eu
          grep -q 'AUD-' AUDITORIA_GEMELO.md

  go:
    name: Go tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Go module
        id: module
        run: |
          if [ -f wms-twin/go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v5
        if: steps.module.outputs.present == 'true'
        with:
          go-version-file: wms-twin/go.mod
          cache: true
          cache-dependency-path: wms-twin/go.sum
      - name: Verify module dependencies
        if: steps.module.outputs.present == 'true'
        working-directory: wms-twin
        run: go mod verify
      - name: Format check
        if: steps.module.outputs.present == 'true'
        working-directory: wms-twin
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        if: steps.module.outputs.present == 'true'
        working-directory: wms-twin
        run: go vet ./...
      - name: Tests with race detector
        if: steps.module.outputs.present == 'true'
        working-directory: wms-twin
        run: go test -race -count=1 ./...
      - name: Report pending Go module
        if: steps.module.outputs.present != 'true'
        run: echo "wms-twin/go.mod is not present yet; Go checks are pending implementation."

  python-boundary:
    name: Existing Python boundary tests
    runs-on: ubuntu-latest
    if: hashFiles('api/prismatec/tests/*.py') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only boundary test dependencies
        run: python -m pip install pytest
      - name: Run boundary tests
        env:
          PYTHONPATH: api
        run: pytest -q api/prismatec/tests
