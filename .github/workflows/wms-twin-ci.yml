name: WMS twin validation

on:
  push:
    branches: [feat/wms-prismatec-genesis, fix/wms-twin-operational-completion]
    paths:
      - 'wms-twin/**'
      - 'scripts/safe-update-wms-twin.sh'
      - 'Guia.md'
      - 'EstructuraBackendGo.md'
      - 'NivelDeParidadConBackendOriginal.md'
      - 'AUDITORIA_GEMELO.md'
      - 'docs/architecture/PRISMA_CORE_BOUNDARY.md'
      - '.github/workflows/wms-twin-ci.yml'
  pull_request:
    branches: [feat/wms-prismatec-genesis]
    paths:
      - 'wms-twin/**'
      - 'scripts/safe-update-wms-twin.sh'
      - 'Guia.md'
      - 'EstructuraBackendGo.md'
      - 'NivelDeParidadConBackendOriginal.md'
      - 'AUDITORIA_GEMELO.md'
      - 'docs/architecture/PRISMA_CORE_BOUNDARY.md'
      - '.github/workflows/wms-twin-ci.yml'

permissions:
  contents: write

concurrency:
  group: wms-twin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and protected-scope guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require handover documents
        run: |
          set -eu
          for file in Guia.md EstructuraBackendGo.md NivelDeParidadConBackendOriginal.md AUDITORIA_GEMELO.md wms-twin/docs/CONTRATO_FRONTEND.md wms-twin/docs/MAPA_RUTAS_ORIGINAL.md wms-twin/docs/INVENTORY_LEDGER.md; do
            test -s "$file" || { echo "Missing or empty required document: $file"; exit 1; }
          done
          test -x scripts/safe-update-wms-twin.sh
      - name: Reject changes outside the twin boundary
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ "$GITHUB_REF_NAME" = "fix/wms-twin-operational-completion" ]; then
            git fetch origin feat/wms-prismatec-genesis
            base="$(git merge-base origin/feat/wms-prismatec-genesis HEAD)"
          else
            git fetch origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          git diff --name-only "$base" HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          forbidden=""
          while IFS= read -r path; do
            case "$path" in
              wms-twin/*|Guia.md|EstructuraBackendGo.md|NivelDeParidadConBackendOriginal.md|AUDITORIA_GEMELO.md|docs/architecture/PRISMA_CORE_BOUNDARY.md|scripts/safe-update-wms-twin.sh|.github/workflows/wms-twin-ci.yml) ;;
              *) forbidden="${forbidden}${path}\n" ;;
            esac
          done < /tmp/changed-files.txt
          if [ -n "$forbidden" ]; then
            echo "Protected original paths were modified:"
            printf '%b' "$forbidden"
            exit 1
          fi
      - name: Require synchronized documentation when Go code changes
        run: |
          set -eu
          if grep -Eq '^wms-twin/.*\.go$' /tmp/changed-files.txt; then
            for file in Guia.md EstructuraBackendGo.md NivelDeParidadConBackendOriginal.md AUDITORIA_GEMELO.md; do
              grep -Fxq "$file" /tmp/changed-files.txt || {
                echo "Go code changed without updating $file"
                exit 1
              }
            done
          fi
      - name: Check audit trail
        run: grep -q 'AUD-' AUDITORIA_GEMELO.md

  go:
    name: Go tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wms-twin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wms-twin/go.mod
          cache: true
          cache-dependency-path: wms-twin/go.sum
      - name: Normalize module graph on the working branch
        if: github.event_name == 'push'
        run: go mod tidy
      - name: Verify module graph on pull requests
        if: github.event_name == 'pull_request'
        run: |
          go mod tidy -diff
          go mod verify
      - name: Verify module archives
        if: github.event_name == 'push'
        run: go mod verify
      - name: Format Go sources
        run: |
          gofmt -w .
          git diff --check
      - name: Vet
        run: go vet ./...
      - name: Race-enabled tests
        run: go test -race -count=1 ./...
      - name: Publish formatting-only commit
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- '*.go'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.go'
            git commit -m "style(wms-twin): apply gofmt"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
