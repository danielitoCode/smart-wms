name: WMS twin validation

on:
  push:
    branches: [feat/wms-prismatec-genesis]
    paths:
      - 'wms-twin/**'
      - 'Guia.md'
      - 'EstructuraBackendGo.md'
      - 'NivelDeParidadConBackendOriginal.md'
      - 'AUDITORIA_GEMELO.md'
      - '.github/workflows/wms-twin-ci.yml'
  pull_request:
    branches: [feat/wms-prismatec-genesis]
    paths:
      - 'wms-twin/**'
      - 'Guia.md'
      - 'EstructuraBackendGo.md'
      - 'NivelDeParidadConBackendOriginal.md'
      - 'AUDITORIA_GEMELO.md'
      - '.github/workflows/wms-twin-ci.yml'

permissions:
  contents: read

concurrency:
  group: wms-twin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and protected-scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require handover documents
        run: |
          set -eu
          for file in Guia.md EstructuraBackendGo.md NivelDeParidadConBackendOriginal.md AUDITORIA_GEMELO.md; do
            test -s "$file" || { echo "Missing or empty required document: $file"; exit 1; }
          done
      - name: Reject modifications to original application paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          forbidden=""
          while IFS= read -r path; do
            case "$path" in
              api/*|admin/*|mobile/*|db/*) forbidden="${forbidden}${path}\n" ;;
            esac
          done < /tmp/changed-files.txt
          if [ -n "$forbidden" ]; then
            echo "Protected original paths were modified:"
            printf '%b' "$forbidden"
            echo "The WMS twin must remain isolated under wms-twin/."
            exit 1
          fi
      - name: Check audit trail
        run: grep -q 'AUD-' AUDITORIA_GEMELO.md

  go:
    name: Go tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wms-twin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wms-twin/go.mod
          cache: true
          cache-dependency-path: wms-twin/go.sum
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Race-enabled tests
        run: go test -race -count=1 ./...
