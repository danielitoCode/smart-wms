name: WMS twin validation

on:
  push:
    branches: [feat/wms-prismatec-genesis]
    paths:
      - 'wms-twin/**'
      - 'scripts/safe-update-wms-twin.sh'
      - 'Guia.md'
      - 'EstructuraBackendGo.md'
      - 'NivelDeParidadConBackendOriginal.md'
      - 'AUDITORIA_GEMELO.md'
      - '.github/workflows/wms-twin-ci.yml'
  pull_request:
    branches: [feat/wms-prismatec-genesis]
    paths:
      - 'wms-twin/**'
      - 'scripts/safe-update-wms-twin.sh'
      - 'Guia.md'
      - 'EstructuraBackendGo.md'
      - 'NivelDeParidadConBackendOriginal.md'
      - 'AUDITORIA_GEMELO.md'
      - '.github/workflows/wms-twin-ci.yml'

permissions:
  contents: read

concurrency:
  group: wms-twin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and protected-scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require handover documents
        run: |
          set -eu
          for file in Guia.md EstructuraBackendGo.md NivelDeParidadConBackendOriginal.md AUDITORIA_GEMELO.md wms-twin/docs/CONTRATO_FRONTEND.md wms-twin/docs/MAPA_RUTAS_BACKEND_ORIGINAL.md; do
            test -s "$file" || { echo "Missing or empty required document: $file"; exit 1; }
          done
          test -x scripts/safe-update-wms-twin.sh
      - name: Reject modifications to original application paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            git fetch origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          git diff --name-only "$base" HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          forbidden=""
          while IFS= read -r path; do
            case "$path" in
              api/*|admin/*|mobile/*|db/*) forbidden="${forbidden}${path}\n" ;;
            esac
          done < /tmp/changed-files.txt
          if [ -n "$forbidden" ]; then
            echo "Protected original paths were modified:"
            printf '%b' "$forbidden"
            echo "The WMS twin must remain isolated under wms-twin/."
            exit 1
          fi
      - name: Check audit trail
        run: grep -q 'AUD-' AUDITORIA_GEMELO.md

  go:
    name: Go tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wms-twin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wms-twin/go.mod
          cache: true
          cache-dependency-path: wms-twin/go.sum
      - name: Resolve module graph and produce checksum lock
        run: |
          go mod tidy
          go mod verify
      - name: Normalize Go formatting in CI workspace
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::warning::Go files need formatting in the branch:"
            printf '%s\n' "$unformatted"
            gofmt -w .
          fi
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race-enabled tests
        run: go test -race -count=1 ./...
