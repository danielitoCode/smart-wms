# Proxy de laboratorio: un solo origen /api para el frontend.
# Cookie wms_backend=twin → gemelo :5001; por defecto Flask :5000.
worker_processes 1;
events { worker_connections 1024; }
http {
  map $cookie_wms_backend $wms_upstream {
    default http://host.docker.internal:5000;
    twin    http://host.docker.internal:5001;
  }
  # Sin Docker Desktop, en Linux use 172.17.0.1 o la IP del host.
  server {
    listen 8080;
    client_max_body_size 32m;

    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass $wms_upstream;
    }

    # Panel demo del twin (estático)
    location /demo/ {
      alias /usr/share/nginx/html/demo/;
      try_files $uri $uri/ /demo/index.html;
    }

    location = / {
      return 302 /demo/;
    }
  }
}
